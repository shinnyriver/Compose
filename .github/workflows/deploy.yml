name: Deploy to Docker Hub & EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Backend
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/backend:latest ./backend
          docker push ${{secrets.DOCKER_USERNAME}}/backend:latest

      - name: Build and Push MySQL
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/mysql:latest ./mysql
          docker push ${{secrets.DOCKER_USERNAME}}/mysql:latest

      - name: Build and Push Nginx
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/nginx:latest ./nginx
          docker push ${{secrets.DOCKER_USERNAME}}/nginx:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH Key
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
            cd ~/springboot-docker-compose
            git reset --hard
            git pull origin main
            chmod 777 deploy.sh
            export DOCKER_HUB_USERNAME="${DOCKER_HUB_USERNAME}"  # ✅ 환경 변수 설정
            ./deploy.sh
          EOF